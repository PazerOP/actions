name: Validate Builds

on:
	push:
		branches: ['**']
	pull_request:

jobs:
	validate:
		runs-on: ubuntu-latest
		steps:
			- uses: actions/checkout@v4

			- uses: actions/setup-node@v4
				with:
					node-version: '20'

			- uses: extractions/setup-just@v2

			- name: Build tab-check-action
				working-directory: tab-check-action
				run: |
					npm ci
					just build

			- name: Build no-scripts-action
				working-directory: no-scripts-action
				run: |
					npm ci
					just build

			- name: Check for uncommitted changes
				run: |
					if ! git diff --exit-code; then
						echo "::error::Built artifacts don't match committed files. Run 'just build' and commit the changes."
						exit 1
					fi
