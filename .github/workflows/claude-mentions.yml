# Claude Mention Response Handler
#
# Purpose: Responds to @claude mentions in GitHub issues and pull requests
# Triggers: Issue comments, PR review comments, PR reviews, new issues containing @claude
#
# Features:
# - Detects @claude mentions in various GitHub events
# - Provides assistance with dotnet tooling support
# - Creates annotations for code feedback
# - Uses permalinks for reliable code references
#
# Usage:
# - Comment "@claude help me with this issue" on any issue or PR
# - Include @claude in issue titles or descriptions for automatic assistance

name: Claude Mentions

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: write
  id-token: write

env:
  MH_CLAUDE_ANNOTATIONS: |
    ## GitHub Actions Annotations
    When providing feedback on code, you can create inline source code annotations using GitHub Actions workflow commands.
    These commands MUST start at the beginning of a line:

    ::error file=path/to/file.cs,line=123::Your error message here
    ::warning file=path/to/file.cs,line=456::Your warning message here
    ::notice file=path/to/file.cs,line=789::Your notice message here

    These commands create actual annotations that appear inline in the GitHub UI on the specified file and line,
    rather than just code blocks in comments. Use these when you want to highlight specific issues, suggestions,
    or important notes about particular lines of code.
  MH_CLAUDE_PERMALINKS: |
    ## Permalinks
    When referencing files in your responses, use GitHub permalinks for precise references:
    - Format: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/path/to/file.cs#L123
    - Line ranges: Add #L123-L456 for multi-line references
    - Examples:
    	- Single line: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/SimpleYamlWriter/YamlValue.cs#L45
    	- Line range: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/SimpleYamlWriter/YamlValue.cs#L45-L50

    Permalinks ensure references remain valid even as code changes, making your feedback more reliable and actionable.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check Actor
        uses: ./.github/actions/check-actor
        with:
          actor: ${{ github.actor }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash(dotnet:*)"
          disallowed_tools: "mcp__github_file_ops__commit_files,git"
          custom_instructions: |
            You have `dotnet` available to you if you want to try running tests or something

            ${{ env.MH_CLAUDE_ANNOTATIONS }}

            ${{ env.MH_CLAUDE_PERMALINKS }}